<!DOCTYPE html>
<html lang="fr" data-theme="light" data-density="comfort">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf8f3" />
  <title>DriveFlow OS — Automobile & Leasing</title>

  <!-- Preconnect to fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Typography: Inter (UI), JetBrains Mono (numbers), IBM Plex Sans Arabic (RTL) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN — config MUST come after the CDN script loads so the
       color remap (indigo/violet/blue → gold) is actually applied. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const GOLD = {
      50: '#fbf7ec', 100: '#f6edd2', 200: '#eedcab', 300: '#e3c77c',
      400: '#d4af5a', 500: '#c9a24b', 600: '#9a7b2e', 700: '#7a5f22',
      800: '#5c471a', 900: '#3d2f12', 950: '#241b0a',
    };
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular'],
            arabic: ['IBM Plex Sans Arabic', 'Inter', 'ui-sans-serif'],
          },
          // White & Gold luxury theme — remap the old brand/blue ramps to
          // champagne gold so every existing bg-indigo-*/text-blue-* utility
          // becomes gold automatically.
          colors: {
            gold: GOLD,
            indigo: GOLD,
            violet: GOLD,
            purple: GOLD,
            blue: GOLD,
            sky: GOLD,
            cyan: GOLD,
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="/index.css" />
</head>
<body class="df-body">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
