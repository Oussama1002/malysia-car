<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="driveflow_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>driveflow_mobile</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Service-worker update banner.
    Flutter-web registers an aggressive service worker that will keep serving
    the old bundle after a deploy until the browser decides to refresh the
    worker — which often means "never" on phones. This script watches for a
    newly installed worker, shows a one-line banner, and on click posts
    'skipWaiting' — the exact message flutter_service_worker.js already
    listens for — so no patching of the generated worker is needed.
  -->
  <style>
    #df-update-banner {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: none; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 16px;
      background: #4f46e5; color: #fff;
      font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      box-shadow: 0 -4px 12px rgba(0,0,0,.15);
      z-index: 2147483647;
    }
    #df-update-banner button {
      background: #fff; color: #4f46e5;
      border: 0; border-radius: 8px;
      padding: 8px 14px; font-weight: 800; cursor: pointer;
    }
    #df-update-banner .df-dismiss {
      background: transparent; color: #e0e7ff; font-weight: 600;
    }
  </style>
  <div id="df-update-banner" role="status" aria-live="polite">
    <span>Une nouvelle version de DriveFlow est disponible.</span>
    <span>
      <button id="df-update-dismiss" class="df-dismiss" type="button">Plus tard</button>
      <button id="df-update-apply" type="button">Mettre à jour</button>
    </span>
  </div>
  <script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var banner = document.getElementById('df-update-banner');
    var applyBtn = document.getElementById('df-update-apply');
    var dismissBtn = document.getElementById('df-update-dismiss');
    var waitingWorker = null;
    var reloading = false;

    function show(worker) {
      waitingWorker = worker;
      banner.style.display = 'flex';
    }
    function hide() { banner.style.display = 'none'; }

    applyBtn.addEventListener('click', function () {
      if (waitingWorker) waitingWorker.postMessage('skipWaiting');
      hide();
    });
    dismissBtn.addEventListener('click', hide);

    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });

    function watch(reg) {
      if (!reg) return;
      // Already an updated worker waiting from a previous session.
      if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
      // A new worker just started installing.
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) show(w);
        });
      });
      // Force an update check on every page load — the default browser
      // interval is up to 24h, which is why stale PWAs linger.
      try { reg.update(); } catch (e) {}
    }

    // Flutter registers the service worker from flutter_bootstrap.js, which
    // is async. Poll briefly until the registration is available.
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) { clearInterval(timer); watch(reg); }
        else if (tries > 40) { clearInterval(timer); }
      });
    }, 500);
  })();
  </script>
</body>
</html>
