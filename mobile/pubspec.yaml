name: driveflow_mobile
description: "Application mobile DriveFlow — module Opérations"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Appels HTTP + intercepteurs (jeton, erreurs).
  dio: ^5.7.0

  # État et injection.
  flutter_riverpod: ^2.6.1

  # Navigation sensible aux liens profonds (notifications push plus tard).
  go_router: ^14.6.1

  # Stockage sécurisé du jeton (Keystore Android, Keychain iOS).
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Formatage FR-MA pour les montants et les dates.
  intl: ^0.19.0

  # Prise de photo (justificatif d'entretien, etat des lieux).
  image_picker: ^1.1.2

  # Appeler, envoyer un email, ouvrir une adresse.
  url_launcher: ^6.3.1

  # Carte OSM pour le module GPS — equivalent Flutter de react-leaflet
  # utilise par le web.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Rendu PDF inline pour le visualiseur de documents (fiche client /
  # vehicule). Supporte Android, iOS et Web. On pin a <2.9 : les
  # versions >=2.9 appellent Matrix4.translateByDouble/scaleByDouble qui
  # n'existent qu'a partir de Flutter 3.27 ; sans ca le build echoue
  # avec "The method 'translateByDouble' isn't defined".
  pdfx: ">=2.6.0 <2.9.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Icone de l'app : flutter_launcher_icons genere toutes les tailles mipmap
# Android (et iOS plus tard). Fond blanc pour qu'elle lise bien sur toutes
# les versions d'Android, dont l'affichage adaptatif (rondes, pastilles).
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
